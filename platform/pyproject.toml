# pyproject.toml —— 后端（接入 / 存储 / 分析 / 账号 / 采集）工程配置 + 机器闸门
# 闸门强度档：Phase 1 严格档（后端主链路必过）——见 docs/code-standards.md §五。
# 包管理：uv。

[project]
name = "platform-backend"
version = "0.0.0"
description = "内部工具汇总与分析平台 —— 共享后端（接入/存储/分析/账号）+ 采集层"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "collection*", "shared*"]
exclude = ["tools*"]

[dependency-groups]
# 开发期工具（机器闸门）。装：uv sync --group dev
dev = [
    "ruff>=0.4",
    "mypy>=1.10,<2.0",
    "vulture>=2.11",
    "import-linter>=2.0",
    "pytest>=8.0",
    "coverage>=7.5",
]

# =====================================================================
# 格式化 + Lint：ruff
# =====================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
# 自动生成物禁止手改，也不参与 lint（文件头标「自动生成，勿手改」）
extend-exclude = [
    ".pydeps/**",
    ".tool-venv/**",
    ".toolprefix/**",
    ".venv/**",
    "shared/contracts/**",
    "tmp-tool-cache/**",
]

[tool.ruff.lint]
# 原型档：先开基础规则（含未用 import F401）。合主干前再加 B/UP/ANN 等收紧。
select = ["E", "F", "I", "W"]

# =====================================================================
# 类型检查：mypy（Phase 1 严格档）
# =====================================================================
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["shared/contracts/"]
strict = true

# =====================================================================
# 死代码扫描：vulture（残留 / AI 不敢删）
# =====================================================================
[tool.vulture]
min_confidence = 80
paths = ["backend", "collection", "tools"]
exclude = ["shared/contracts/"]

# =====================================================================
# 分层依赖：import-linter（单向依赖，禁止反向/跨层）
# 采集 → 接入 → 存储 → 分析 → 展示；两个前端互不 import。
# Phase 1 起接进 CI 必过。
# =====================================================================
[tool.importlinter]
root_packages = ["backend", "collection", "shared"]

[[tool.importlinter.contracts]]
name = "单向分层：接入/分析 → 存储/账号 → 采集/共享"
type = "layers"
layers = [
    "backend.ingestion",
    "backend.analytics",
    "backend.auth",
    "backend.storage",
    "collection",
    "shared",
]

# =====================================================================
# 测试 + 覆盖率：pytest / coverage（分析层纯函数必须有单测）
# =====================================================================
[tool.pytest.ini_options]
testpaths = ["backend", "collection"]
python_files = ["test_*.py"]
addopts = ["-p", "no:cacheprovider"]

[tool.coverage.run]
source = ["backend", "collection"]
omit = ["shared/contracts/*"]
