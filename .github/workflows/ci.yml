# CI —— 机器闸门兜底。
# 现在：Phase 1 后端主链路关卡必过；前端仍为占位，继续宽松。
# 见 规划/总则/代码规范.md §五「闸门强度按阶段校准」。

name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --group dev
      - name: ruff format --check
        run: uv run ruff format --check backend collection tools
      - name: ruff check
        run: uv run ruff check backend collection tools
      - name: mypy
        run: uv run mypy backend collection tools
      - name: vulture（死代码）
        run: uv run vulture
      - name: import-linter（分层依赖）
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [user-portal, admin-dashboard]
    defaults:
      run:
        working-directory: platform/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        continue-on-error: true   # 占位 app 暂无 lockfile/源码
      - name: prettier
        run: npx prettier --check .
        continue-on-error: true
      - name: eslint
        run: npm run lint
        continue-on-error: true
      - name: tsc
        run: npm run typecheck
        continue-on-error: true
      - name: knip（死代码）
        run: npm run deadcode
        continue-on-error: true
