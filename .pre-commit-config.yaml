# .pre-commit-config.yaml —— 本地提交前先跑一遍机器闸门，CI 再兜底跑同一套。
# 强度档：原型档（宽松能跑）。轻量、零依赖的关卡现在就启用；重关卡（mypy/vulture/
# import-linter/前端 eslint/tsc/knip/pytest）放在 CI，合入主干前再拧严并接进本文件。
# 见 规划/总则/代码规范.md §五。

default_language_version:
  python: python3.11

repos:
  # 通用卫生
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files

  # Python：格式化 + Lint（含未用 import）。排除自动生成物。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^platform/
        exclude: ^platform/shared/contracts/
      - id: ruff-format
        files: ^platform/
        exclude: ^platform/shared/contracts/

  # 前端：Prettier 格式化（按 platform/.prettierrc.json）。
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^platform/.*\.(ts|tsx|js|jsx|json|css|md)$
        exclude: ^platform/shared/contracts/
