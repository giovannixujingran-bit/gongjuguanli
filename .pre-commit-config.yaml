# .pre-commit-config.yaml —— 本地提交前先跑一遍机器闸门，CI 再兜底跑同一套。
# 强度档：Phase 1 后端主链路必过；前端仍为占位宽松档。
# 见 platform/docs/code-standards-代码规范.md §五。

default_language_version:
  python: python3.11

repos:
  # 通用卫生
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files

  # Python：格式化 + Lint（含未用 import）。排除自动生成物。
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^platform/(backend|collection|tools)/
        exclude: ^platform/shared/contracts/
      - id: ruff-format
        files: ^platform/(backend|collection|tools)/
        exclude: ^platform/shared/contracts/

  # Phase 1 后端重关卡：依赖 uv，同 CI 一致。
  - repo: local
    hooks:
      - id: platform-mypy
        name: platform mypy
        entry: powershell -NoProfile -Command "Set-Location platform; uv run mypy backend collection tools"
        language: system
        pass_filenames: false
        files: ^platform/(backend|collection|shared|tools)/
      - id: platform-vulture
        name: platform vulture
        entry: powershell -NoProfile -Command "Set-Location platform; uv run vulture"
        language: system
        pass_filenames: false
        files: ^platform/(backend|collection)/
      - id: platform-import-linter
        name: platform import-linter
        entry: powershell -NoProfile -Command "Set-Location platform; uv run lint-imports"
        language: system
        pass_filenames: false
        files: ^platform/(backend|collection|shared)/
      - id: platform-pytest
        name: platform pytest
        entry: powershell -NoProfile -Command "Set-Location platform; uv run pytest"
        language: system
        pass_filenames: false
        files: ^platform/(backend|collection|shared)/

  # 前端：Prettier 格式化（按 platform/.prettierrc.json）。
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^platform/.*\.(ts|tsx|js|jsx|json|css|md)$
        # 生成物不参与格式化：shared/contracts（schema 生成）、integrations/handoff-kit（接入包生成）
        exclude: ^platform/(shared/contracts/|integrations/handoff-kit/)
